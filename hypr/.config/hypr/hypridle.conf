# Home-PC policy: no screen locker. Hypridle only controls display power and
# suspension, so it cannot acquire Hyprland's secure session lock.

# Turn displays off after 15 minutes. Any input turns them back on.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after 30 minutes. Resuming returns directly to the desktop.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
