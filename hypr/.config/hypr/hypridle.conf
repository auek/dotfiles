# Home-PC policy: no screen locker. Hypridle only controls display power and
# suspension, so it cannot acquire Hyprland's secure session lock.

listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
