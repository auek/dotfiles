##### COLORSCHEME: Gruvbox Dark Medium
set-option -g status "on"
set-option -g status-style bg=#282828,fg=#ebdbb2
set-window-option -g window-status-style bg=#3c3836,fg=#ebdbb2
set-window-option -g window-status-activity-style bg=#282828,fg=#a89984
set-window-option -g window-status-current-style bg=#d65d0e,fg=#282828
set-option -g pane-active-border-style fg=#a89984
set-option -g pane-border-style fg=#3c3836
set-option -g message-style bg=#3c3836,fg=#ebdbb2
set-option -g message-command-style bg=#3c3836,fg=#ebdbb2
set-option -g display-panes-active-colour "#a89984"
set-option -g display-panes-colour "#3c3836"
set-window-option -g clock-mode-colour "#83a598"
set-window-option -g window-status-bell-style bg=#cc241d,fg=#282828

# Explicit palette colours keep modes independent of tmux's built-in themes.
set-window-option -g mode-style bg=#d79921,fg=#282828
set-window-option -gq tree-mode-selection-style "#{E:mode-style}"
set-window-option -gq tree-mode-border-style bg=#282828,fg=#3c3836
set-window-option -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#a89984,#3c3836}"
set-window-option -gq copy-mode-match-style bg=#689d6a,fg=#282828
set-window-option -gq copy-mode-current-match-style bg=#b16286,fg=#282828
set-window-option -gq copy-mode-mark-style bg=#d8a657,fg=#282828
set-window-option -gq copy-mode-line-number-style fg=#a89984
set-window-option -gq copy-mode-current-line-number-style fg=#7daea3
set-window-option -gq switch-mode-match-style bg=#689d6a,fg=#282828
set-window-option -gq menu-style bg=#3c3836,fg=#ebdbb2
set-window-option -gq menu-selected-style bg=#d79921,fg=#282828
set-window-option -gq menu-border-style bg=#3c3836,fg=#7c6f64
set-window-option -gq popup-style bg=#3c3836,fg=#ebdbb2
set-window-option -gq popup-border-style bg=#3c3836,fg=#7c6f64
set-window-option -gq display-panes-border-style bg=#282828,fg=#3c3836
set-window-option -gq pane-scrollbars-style bg=#3c3836,fg=#a89984
# The inside/outside fill format is only supported with tmux 3.8's tree styles.
if-shell -F '#{!=:#{tree-mode-selection-style},}' 'set-window-option -g fill-character "#{?is_inside,#[bg=#282828] ,#[fg=#a89984]#[acs]~}"'

set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[bg=#504945,fg=#ebdbb2] #S #[bg=#282828,fg=#504945,nobold,noitalics,nounderscore]"
set-option -g status-right "#[bg=#282828,fg=#3c3836,nobold,nounderscore,noitalics]#[bg=#3c3836,fg=#d5c4a1] %Y-%m-%d  %H:%M #[bg=#3c3836,fg=#a89984,nobold,noitalics,nounderscore]#[bg=#a89984,fg=#282828] #h "
set-window-option -g window-status-current-format "#[bg=#d79921,fg=#282828,nobold,noitalics,nounderscore]#[bg=#d79921,fg=#3c3836] #I #[bg=#d79921,fg=#282828,bold] #W#{?window_zoomed_flag,*Z,} #[bg=#282828,fg=#d79921,nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[bg=#3c3836,fg=#282828,noitalics]#[bg=#3c3836,fg=#ebdbb2] #I  #W #[bg=#282828,fg=#3c3836,noitalics]"
