# Load after the theme and local overrides. Missing plugins leave tmux usable.
# Repeated loading is intentional: Continuum reinstates its status-line job
# after a theme change and avoids adding the same job twice.
if-shell 'test -x "$HOME/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"' {
    run-shell '"$HOME/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"'
    if-shell 'test -x "$HOME/.local/share/tmux/plugins/tmux-continuum/continuum.tmux"' {
        run-shell '"$HOME/.local/share/tmux/plugins/tmux-continuum/continuum.tmux"'
    }
}
