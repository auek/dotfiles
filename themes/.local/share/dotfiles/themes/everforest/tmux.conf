##### COLORSCHEME: Everforest Dark Hard
set-option -g status "on"
set-option -g status-style bg=#272e33,fg=#d3c6aa
set-window-option -g window-status-style bg=#2e383c,fg=#859289
set-window-option -g window-status-activity-style bg=#2e383c,fg=#dbbc7f
set-window-option -g window-status-current-style bg=#374145,fg=#a7c080
set-option -g pane-active-border-style fg=#a7c080
set-option -g pane-border-style fg=#414b50
set-option -g message-style bg=#2e383c,fg=#d3c6aa
set-option -g message-command-style bg=#2e383c,fg=#d3c6aa
set-option -g display-panes-active-colour "#a7c080"
set-option -g display-panes-colour "#414b50"
set-window-option -g clock-mode-colour "#7fbbb3"
set-window-option -g window-status-bell-style bg=#493b40,fg=#e67e80

set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[bg=#2e383c,fg=#a7c080] #S #[bg=#272e33,fg=#2e383c,nobold,noitalics,nounderscore]"
set-option -g status-right "#[bg=#272e33,fg=#2e383c,nobold,nounderscore,noitalics]#[bg=#2e383c,fg=#d3c6aa] %Y-%m-%d  %H:%M #[bg=#2e383c,fg=#374145,nobold,noitalics,nounderscore]#[bg=#374145,fg=#a7c080] #h "
set-window-option -g window-status-current-format "#[bg=#374145,fg=#272e33,nobold,noitalics,nounderscore]#[bg=#374145,fg=#859289] #I #[bg=#374145,fg=#a7c080,bold] #W#{?window_zoomed_flag,*Z,} #[bg=#272e33,fg=#374145,nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[bg=#2e383c,fg=#272e33,noitalics]#[bg=#2e383c,fg=#{?window_bell_flag,#e67e80,#{?window_activity_flag,#dbbc7f,#859289}}] #I  #W #[bg=#272e33,fg=#2e383c,noitalics]"
