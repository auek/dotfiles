# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-s
bind-key C-s send-prefix

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# ESC key fix
set -sg escape-time 8

# Vi mode
set -g mode-keys vi

# Vi mode key bindings for copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi 'C-b' send -X begin-selection \; send -X rectangle-on
bind -T copy-mode-vi y if-shell "uname -s | grep -q Darwin" \
    "send-keys -X copy-pipe 'pbcopy'" \
    "send-keys -X copy-pipe 'wl-copy --type text/plain'"
bind -T copy-mode-vi Enter if-shell "uname -s | grep -q Darwin" \
    "send-keys -X copy-pipe-and-cancel 'pbcopy'" \
    "send-keys -X copy-pipe-and-cancel 'wl-copy --type text/plain'"

# override incorrect previous binding
bind p previous-window

# Paste from system clipboard
bind-key C-p if-shell "uname -s | grep -q Darwin" \
    "run \"pbpaste | tmux load-buffer - ; tmux paste-buffer\"" \
    "run \"wl-paste --no-newline | tmux load-buffer - ; tmux paste-buffer\""

# Vi mode pane switching with Ctrl+h/j/k/l (vim-tmux-navigator)
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Window navigation with Alt
bind -n M-n next-window
bind -n M-p previous-window

# alias for syncing panes
bind-key V setw synchronize-panes\; display "Synchronization: #{?pane_synchronized,on,off}"

# alias for tree view of windows and panes
bind-key S choose-tree -Z

# Update environment variables
set-option -g update-environment "\
  SSH_AUTH_SOCK \
  SSH_CONNECTION \
  DISPLAY \
  WAYLAND_DISPLAY \
  XDG_RUNTIME_DIR \
  HYPRLAND_INSTANCE_SIGNATURE"

# Start panes/windows in zsh so shell functions from .zshrc are available.
set-option -g default-shell /usr/bin/zsh
set-option -g default-command "/usr/bin/zsh -l"

# Colors
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm-kitty:RGB,foot:RGB"

##### COLORSCHEME: Everforest Dark Hard
set-option -g status "on"

# default statusbar color
set-option -g status-style bg=#272e33,fg=#d3c6aa

# default window title colors
set-window-option -g window-status-style bg=#2e383c,fg=#859289

# default window with an activity alert
set-window-option -g window-status-activity-style bg=#2e383c,fg=#dbbc7f

# active window title colors
set-window-option -g window-status-current-style bg=#374145,fg=#a7c080

# pane border
set-option -g pane-active-border-style fg=#a7c080
set-option -g pane-border-style fg=#414b50

# message infos
set-option -g message-style bg=#2e383c,fg=#d3c6aa

# writing commands inactive
set-option -g message-command-style bg=#2e383c,fg=#d3c6aa

# pane number display
set-option -g display-panes-active-colour "#a7c080"
set-option -g display-panes-colour "#414b50"

# clock
set-window-option -g clock-mode-colour "#7fbbb3"

# bell
set-window-option -g window-status-bell-style bg=#493b40,fg=#e67e80

## Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "80"
set-option -g status-right-style none
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left "#[bg=#2e383c,fg=#a7c080] #S #[bg=#272e33,fg=#2e383c,nobold,noitalics,nounderscore]"
set-option -g status-right "#[bg=#272e33,fg=#2e383c,nobold,nounderscore,noitalics]#[bg=#2e383c,fg=#d3c6aa] %Y-%m-%d  %H:%M #[bg=#2e383c,fg=#374145,nobold,noitalics,nounderscore]#[bg=#374145,fg=#a7c080] #h "

set-window-option -g window-status-current-format "#[bg=#374145,fg=#272e33,nobold,noitalics,nounderscore]#[bg=#374145,fg=#859289] #I #[bg=#374145,fg=#a7c080,bold] #W#{?window_zoomed_flag,*Z,} #[bg=#272e33,fg=#374145,nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[bg=#2e383c,fg=#272e33,noitalics]#[bg=#2e383c,fg=#{?window_bell_flag,#e67e80,#{?window_activity_flag,#dbbc7f,#859289}}] #I  #W #[bg=#272e33,fg=#2e383c,noitalics]"

